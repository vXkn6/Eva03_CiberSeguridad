<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureDev Tickets</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
    nav { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid #ccd; margin-bottom: 2rem; }
    nav form { margin-left: auto; }
    a { color: #0759aa; }
    input, textarea, button { font: inherit; padding: .4rem; }
    textarea { display: block; width: 100%; min-height: 5rem; box-sizing: border-box; }
    .error { color: #9b152a; }
    .card { border: 1px solid #ccd; border-radius: .4rem; padding: 1rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <nav>
    <strong>SecureDev Tickets</strong>
    {% if session.user_id %}
      <a href="{{ url_for('index') }}">Mis tickets</a>
      <a href="{{ url_for('search') }}">Buscar</a>
      <span>{{ session.username }}</span>
      <form method="post" action="{{ url_for('logout') }}"><button>Salir</button></form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
